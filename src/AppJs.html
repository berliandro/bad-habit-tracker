<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var state = { status:null, dashboard:null };
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function run(fn, args){ return new Promise(function(resolve, reject){
    if(!window.google || !google.script || !google.script.run){ reject(new Error('Apps Script bridge unavailable')); return; }
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){ reject(new Error((e && e.message) || 'Server error')); });
    (r[fn]).apply(r, args || []);
  });}

  function fmtDays(v){ if(v===null||v===undefined||v===''||!isFinite(Number(v))) return '—'; var n=Math.round(Number(v)); return n+' day'+(n===1?'':'s'); }
  function fmtAvg(v){
    if(v===null||v===undefined||v===''||!isFinite(Number(v))) return '—';
    var n=Number(v);
    if(Math.round(n)===n){ var i=Math.round(n); return i+' day'+(i===1?'':'s'); }
    return n.toFixed(1)+' days';
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Deterministic YYYY-MM-DD helpers. Never locale-parse; never overwrite server dates.
  function parseYMD(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));
    if(!m) return null;
    return { y:Number(m[1]), m:Number(m[2]), d:Number(m[3]) };
  }
  function shortLabel(ymd){ if(!ymd) return '—'; return MONTHS[ymd.m-1]+' '+ymd.d; }
  function longLabel(ymd){ if(!ymd) return '—'; return MONTHS[ymd.m-1]+' '+ymd.d+', '+ymd.y; }
  function humanize(eventDate, todayStr){
    if(eventDate===todayStr) return 'Today';
    var a=parseYMD(eventDate), b=parseYMD(todayStr);
    if(!a||!b) return eventDate;
    var da=new Date(Date.UTC(a.y,a.m-1,a.d)), db=new Date(Date.UTC(b.y,b.m-1,b.d));
    var diff=Math.round((db-da)/86400000);
    if(diff===1) return 'Yesterday';
    if(a.y===b.y) return shortLabel(a);
    return longLabel(a);
  }

  function setLoading(on, label){
    var el = $('loading'); if(!el) return;
    el.hidden = !on; if(on && label) $('loadingLabel').textContent = label;
  }

  async function refreshAll(){
    try{
      var st = await run('getAppStatus', []);
      if(!st.success) throw new Error(st.error.message);
      state.status = st.data;
      $('keyState').textContent = state.status.geminiConfigured ? 'Gemini connected' : 'Gemini not connected';
      if(!state.status.geminiConfigured){ openModal('keyModal'); }
      else if(!state.status.goalConfigured){ openModal('goalModal'); }
      var dash = await run('getDashboardData', []);
      if(dash.success){ state.dashboard = dash.data; renderDashboard(dash.data); }
      renderGoalSummary();
    }catch(e){ showError(String(e.message||e)); }
  }

  function renderGoalSummary(){
    var g = state.status && state.status.goal;
    var el = $('goalLine');
    if(!g){ el.textContent = 'Goal · not set'; return; }
    if(g.goalMode==='STOP'){ el.textContent = 'Goal · Stop'; }
    else{ el.textContent = 'Goal · '+g.targetOccurrences+' / '+g.targetPeriodDays+' days'; }
  }

  function renderDashboard(d){
    $('mCurrent').textContent = (d.currentIntervalDays===null||d.currentIntervalDays===undefined) ? '—' : String(Math.round(Number(d.currentIntervalDays)));
    // Editorial split: dominant number, receding unit. mTarget keeps its contract ID.
    var mt = $('mTarget');
    if(d.nextTargetDays===null||d.nextTargetDays===undefined||d.nextTargetDays===''){ mt.textContent = '—'; }
    else{
      var tn = Math.round(Number(d.nextTargetDays));
      mt.innerHTML = esc(String(tn))+'<span class="unit">'+(tn===1?'day':'days')+'</span>';
    }
    var remainEl = $('mRemain');
    if(d.daysRemaining===null||d.daysRemaining===undefined){ remainEl.textContent = '—'; }
    else if(Number(d.daysRemaining)<=0){ remainEl.textContent = 'Due — be gentle with yourself'; }
    else{ remainEl.textContent = fmtDays(d.daysRemaining)+' remaining'; }
    var tdl = $('targetDateLine'), wrap = $('targetDateWrap');
    var pd = parseYMD(d.nextTargetDate);
    if(pd && d.daysRemaining!==null && d.daysRemaining!==undefined && Number(d.daysRemaining)>0){
      tdl.textContent = 'Aim for '+shortLabel(pd); wrap.style.display='';
    } else if(pd){ tdl.textContent = longLabel(pd); wrap.style.display=''; }
    else { tdl.textContent=''; wrap.style.display='none'; }
    var tl = $('trendLine');
    if(d.stats && d.stats.trend){ tl.textContent = ' · '+String(d.stats.trend).toLowerCase(); }
    else { tl.textContent=''; }
    var g = d.goal;
    // Mode tag only: the numeric goal already lives in #goalLine, so the chip
    // names the mode instead of repeating the numbers. Hidden when redundant.
    var chip = $('mGoal');
    if(g && g.goalMode!=='STOP' && g.targetOccurrences && g.targetPeriodDays){
      chip.style.display=''; chip.textContent='Reduce';
    } else {
      chip.style.display='none'; chip.textContent='';
    }
    $('aiInsight').textContent = d.aiInsight || 'Log your first occurrence and an insight will appear here.';
    $('aiMeta').textContent = d.aiModel ? ('Model · '+d.aiModel) : '';
    var s = d.stats || {};
    var kv = $('statsKv');
    kv.innerHTML = '';
    var rows = [
      ['Latest interval', fmtDays(s.latestInterval)],
      ['Average', fmtAvg(s.averageInterval)],
      ['Median', fmtDays(s.medianInterval)],
      ['Longest', fmtDays(s.longestInterval)],
      ['Current streak', fmtDays(s.currentStreakDays)],
      ['Last 7 days', (s.recentFrequency7d==null?'—':s.recentFrequency7d+' occurrences')],
      ['Trend', esc(s.trend||'—')],
      ['Consistency', esc(s.consistency||'—')]
    ];
    rows.forEach(function(r){
      var wrapRow=document.createElement('div');
      var dt=document.createElement('dt'); dt.textContent=r[0];
      var dd=document.createElement('dd'); dd.innerHTML=r[1];
      wrapRow.appendChild(dt); wrapRow.appendChild(dd); kv.appendChild(wrapRow);
    });
    var feed = $('timeline'); feed.innerHTML='';
    var hist = d.recentHistory||[];
    hist.forEach(function(h){
      var li=document.createElement('li');
      li.title = h.eventDate;
      var body=document.createElement('div'); body.className='feed-body';
      var title=document.createElement('p'); title.className='feed-date';
      var n=Number(h.count);
      var countLabel = (n===1) ? '1 occurrence' : (esc(String(h.count))+' occurrences');
      title.innerHTML = esc(humanize(h.eventDate, d.today||''))+'<span class="count">'+countLabel+'</span>';
      var sub=document.createElement('p'); sub.className='feed-sub';
      sub.textContent = (h.interval===null||h.interval===undefined) ? 'Start of interval' : (String(h.interval)+' days since previous');
      body.appendChild(title); body.appendChild(sub);
      var btn=document.createElement('button'); btn.className='row-delete'; btn.textContent='Delete';
      btn.setAttribute('aria-label','Delete entry '+h.eventDate);
      btn.onclick=function(){ delEntry(h.logId); };
      li.appendChild(body); li.appendChild(btn); feed.appendChild(li);
    });
    if(!hist.length){
      var li0=document.createElement('li'); li0.className='empty';
      li0.innerHTML='<p class="empty-note">No history yet.<br>Log your first occurrence to start measuring your intervals.</p>';
      feed.appendChild(li0);
    }
    if(d.warning){ showWarn(d.warning); }
    if(d.aiAvailable===false){ showWarn('Occurrence saved. AI analysis is temporarily unavailable ('+esc(d.aiErrorCode||'AI_UNAVAILABLE')+').'); }
  }

  async function delEntry(id){
    if(!confirm('Delete this entry?')) return;
    setLoading(true,'Updating your timeline…');
    try{ var r=await run('deleteEntry',[id]); if(!r.success) throw new Error(r.error.message); await refreshAll(); }
    catch(e){ showError(String(e.message||e)); } finally{ setLoading(false); }
  }

  function showError(m){ var n=$('alert'); n.className='banner err'; n.hidden=false; n.textContent=m; }
  function showWarn(m){ var n=$('alert'); n.className='banner warn'; n.hidden=false; n.textContent=m; }
  function clearAlert(){ var n=$('alert'); n.hidden=true; }

  function openModal(id){ var d=$(id); if(d && typeof d.showModal==='function'){ if(!d.open) d.showModal(); } }
  function closeModal(id){ var d=$(id); if(d && d.open) d.close(); }

  async function submitLog(){
    clearAlert();
    var v = $('logInput').value.trim();
    if(!v){ showError('Type something generic like “I did it today”.'); $('logInput').focus(); return; }
    var btn=$('logBtn'); btn.disabled=true; setLoading(true,'Recording…');
    try{
      setTimeout(function(){ if(btn.disabled) $('loadingLabel').textContent='Updating your timeline…'; }, 700);
      setTimeout(function(){ if(btn.disabled) $('loadingLabel').textContent='Calculating your next target…'; }, 1600);
      // Server response is authoritative for dates; frontend never rewrites event dates.
      var res = await run('logOccurrence',[v]);
      if(!res.success) throw new Error(res.error.code+': '+res.error.message);
      state.dashboard = res.data; renderDashboard(res.data);
      $('logInput').value='';
      var nt = res.data && res.data.lastRecommendation;
      if(nt){ showWarn('Saved. Next target: '+nt.finalDays+' days ('+nt.nextTargetDate+').'); }
    }catch(e){ showError(String(e.message||e)); }
    finally{ btn.disabled=false; setLoading(false); }
  }

  document.addEventListener('DOMContentLoaded', function(){
    $('logBtn').addEventListener('click', submitLog);
    $('logInput').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); submitLog(); } });
    $('settingsBtn').addEventListener('click', function(){ openModal('settingsModal'); syncSettingsForm(); });
    $('saveKeyBtn').addEventListener('click', async function(){
      var k=$('keyInput').value.trim(); if(k.length<10){ $('keyMsg').textContent='Key looks too short.'; return; }
      $('saveKeyBtn').disabled=true; $('keyMsg').textContent='Saving…';
      try{ var r=await run('saveGeminiApiKey',[k]); if(!r.success) throw new Error(r.error.message);
        $('keyMsg').textContent='Saved.'; $('keyInput').value=''; closeModal('keyModal'); await refreshAll();
      }catch(e){ $('keyMsg').textContent='Error: '+String(e.message||e); }
      finally{ $('saveKeyBtn').disabled=false; }
    });
    $('saveGoalBtn').addEventListener('click', async function(){
      var mode = document.querySelector('input[name=goalMode]:checked') ? document.querySelector('input[name=goalMode]:checked').value : 'REDUCE_FREQUENCY';
      var c = Number($('freqCount').value), p = Number($('freqPeriod').value);
      try{
        var r = mode==='STOP' ? await run('saveGoalSettings',['STOP',null,null]) : await run('saveGoalSettings',['REDUCE_FREQUENCY',c,p]);
        if(!r.success) throw new Error(r.error.message);
        closeModal('goalModal'); await refreshAll();
      }catch(e){ $('goalMsg').textContent='Error: '+String(e.message||e); }
    });
    document.querySelectorAll('input[name=goalMode]').forEach(function(r){ r.addEventListener('change', syncFreqVisibility); });
    $('saveSettingsGoalBtn').addEventListener('click', async function(){
      var mode = document.querySelector('input[name=sGoalMode]:checked') ? document.querySelector('input[name=sGoalMode]:checked').value : 'REDUCE_FREQUENCY';
      try{
        var r = mode==='STOP' ? await run('saveGoalSettings',['STOP',null,null])
          : await run('saveGoalSettings',['REDUCE_FREQUENCY', Number($('sFreqCount').value), Number($('sFreqPeriod').value)]);
        if(!r.success) throw new Error(r.error.message);
        $('settingsMsg').textContent='Goal saved.'; await refreshAll();
      }catch(e){ $('settingsMsg').textContent='Error: '+String(e.message||e); }
    });
    $('saveSettingsKeyBtn').addEventListener('click', async function(){
      var k=$('settingsKeyInput').value.trim(); if(k.length<10){ $('settingsMsg').textContent='Key looks too short.'; return; }
      try{ var r=await run('saveGeminiApiKey',[k]); if(!r.success) throw new Error(r.error.message);
        $('settingsMsg').textContent='API key updated.'; $('settingsKeyInput').value=''; await refreshAll();
      }catch(e){ $('settingsMsg').textContent='Error: '+String(e.message||e); }
    });
    $('undoBtn').addEventListener('click', async function(){
      if(!confirm('Undo the most recent entry?')) return;
      setLoading(true,'Updating your timeline…');
      try{ var r=await run('undoLastEntry',[]); if(!r.success) throw new Error(r.error.message); await refreshAll(); }
      catch(e){ showError(String(e.message||e)); } finally{ setLoading(false); }
    });
    refreshAll();
  });

  function syncFreqVisibility(){
    var mode = document.querySelector('input[name=goalMode]:checked');
    $('freqRow').style.display = (!mode || mode.value==='STOP') ? 'none' : '';
  }
  function syncSettingsForm(){
    var g = state.status && state.status.goal;
    if(!g) return;
    var radios = document.querySelectorAll('input[name=sGoalMode]');
    radios.forEach(function(r){ r.checked = (r.value===(g.goalMode==='STOP'?'STOP':'REDUCE_FREQUENCY')); });
    if(g.targetOccurrences) $('sFreqCount').value = g.targetOccurrences;
    if(g.targetPeriodDays) $('sFreqPeriod').value = g.targetPeriodDays;
    $('settingsMsg').textContent='';
  }
})();
</script>
