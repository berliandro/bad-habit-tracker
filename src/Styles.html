<style>
:root{
  --bg:#060708; --ink:#f2f4f3; --muted:#9aa3ab; --faint:#646d75;
  --line:rgba(255,255,255,.08); --line-soft:rgba(255,255,255,.055);
  --glass:rgba(255,255,255,.045);
  --accent:#4db6ac; --accent-ink:#052825;
  --radius:18px;
  --shadow-soft:0 1px 2px rgba(0,0,0,.5),0 10px 32px rgba(0,0,0,.45);
  --shadow-pop:0 12px 44px rgba(0,0,0,.6);
  --focus:0 0 0 3px rgba(77,182,172,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  font-family:Inter,Roboto,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
/* Atmospheric aurora — dim, slow, behind everything */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.aurora span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.aurora .b1{width:56vmax;height:56vmax;left:-18vmax;top:-22vmax;
  background:radial-gradient(circle at 40% 40%,rgba(77,182,172,.10),transparent 65%)}
.aurora .b2{width:62vmax;height:62vmax;right:-24vmax;bottom:-26vmax;
  background:radial-gradient(circle at 60% 60%,rgba(148,163,184,.09),transparent 65%)}
@media (prefers-reduced-motion:no-preference){
  .aurora .b1{animation:drift1 46s ease-in-out infinite alternate}
  .aurora .b2{animation:drift2 60s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(4vmax,3vmax)}}
  @keyframes drift2{to{transform:translate(-4vmax,-3vmax)}}
}
.page{max-width:680px;margin:0 auto;padding:22px 20px 88px}
/* Minimal header */
.site-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 4px}
.identity{display:flex;align-items:center;gap:10px;min-width:0}
.identity .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.identity .app{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.identity .tag{margin:0;color:var(--muted);font-size:12.5px}
/* Buttons — one clear primary, everything else quiet */
.primary-btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);
  border-radius:999px;padding:12px 22px;font-size:14.5px;font-weight:650;cursor:pointer;
  box-shadow:var(--shadow-soft);transition:filter .15s ease,transform .08s ease}
.primary-btn:hover{filter:brightness(1.07)}
.primary-btn:active{transform:scale(.98)}
.primary-btn:disabled{opacity:.6;cursor:wait}
.primary-btn:focus-visible{outline:none;box-shadow:var(--focus)}
.quiet-btn{appearance:none;background:transparent;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;
  cursor:pointer;transition:border-color .15s ease,color .15s ease}
.quiet-btn:hover{color:var(--ink);border-color:rgba(255,255,255,.22)}
.quiet-btn:focus-visible{outline:none;box-shadow:var(--focus)}
.quiet-btn.small{padding:6px 12px;font-size:12.5px}
/* Banner */
.banner{border-radius:14px;padding:12px 14px;font-size:13.5px;margin:12px 0 0;
  border:1px solid var(--line);background:rgba(255,255,255,.03)}
.banner.warn,.banner.err{border-left:3px solid var(--accent)}
/* Hero — typography creates the hierarchy, no box */
.hero{text-align:center;padding:36px 8px 30px}
.statusbar{font-size:12px;color:var(--faint);margin:10px 0 0}
.kicker{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.target{margin:6px 0 0;font-size:clamp(58px,13vw,86px);line-height:1.02;font-weight:600;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums}
.target .unit{font-size:.32em;font-weight:500;letter-spacing:-.01em;color:var(--muted);margin-left:.14em}
.remain{margin:10px 0 0;color:var(--muted);font-size:15px}
.remain .sep{color:var(--faint)}
.current-line{margin:14px 0 0;color:var(--muted);font-size:13.5px}
.current-line #mCurrent{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.goal-line{margin:12px 0 0;color:var(--faint);font-size:12.5px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.goal-chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);
  font-size:12px;font-variant-numeric:tabular-nums}
/* Logging dock — the single translucent surface on the page */
.logdock{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-soft)}
.log-prompt{display:block;font-size:14px;margin:0 0 10px}
.log-row{display:flex;gap:10px}
.log-row input{flex:1;min-width:0;background:rgba(0,0,0,.38);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;font-size:15px;color:var(--ink);outline:none}
.log-row input::placeholder{color:var(--faint)}
.log-row input:focus{border-color:var(--accent);box-shadow:var(--focus)}
.micro{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.micro.faint{color:var(--faint)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-top:10px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.3}}}
/* Content blocks separated by whitespace, not boxes */
.block{margin:40px 0 0;padding:0;background:none;border:0}
.block h2,.insight-block h2{font-size:14px;font-weight:600;color:var(--ink);margin:0 0 4px;letter-spacing:-.01em}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.insight-block{margin:36px 0 0;padding:0}
.insight{margin:6px 0 0;font-size:14.5px;color:var(--ink);border-left:2px solid var(--accent);padding-left:12px}
/* Timeline feed */
.feed{list-style:none;margin:14px 0 0;padding:0}
.feed li{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 0 12px 22px;border:0}
.feed li::before{content:"";position:absolute;left:5px;top:19px;width:7px;height:7px;border-radius:50%;
  background:var(--faint)}
.feed li:first-child::before{background:var(--accent)}
.feed li::after{content:"";position:absolute;left:8px;top:32px;bottom:-4px;width:1px;background:var(--line-soft)}
.feed li:last-child::after{display:none}
.feed-body{flex:1;min-width:0}
.feed-date{margin:0;font-size:14px;font-weight:600}
.feed-date .count{color:var(--muted);font-weight:500;font-size:12.5px;margin-left:8px;font-variant-numeric:tabular-nums}
.feed-sub{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.row-delete{background:none;border:0;color:var(--faint);font-size:12.5px;cursor:pointer;padding:6px 4px;
  opacity:.55;border-radius:8px;min-height:32px;min-width:44px}
.row-delete:hover{opacity:1;color:var(--ink)}
.row-delete:focus-visible{outline:none;box-shadow:var(--focus);opacity:1}
.feed li.empty{padding-left:0}
.feed li.empty::before,.feed li.empty::after{display:none}
.empty-note{color:var(--muted);font-size:14px;margin:0}
/* Compact statistics — rows, not cards */
.statlist{margin:8px 0 0;padding:0}
.statlist>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:10px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.statlist dt{color:var(--muted)}
.statlist dd{margin:0;font-weight:550;font-variant-numeric:tabular-nums}
/* Footer */
footer{margin:48px 0 0;color:var(--faint);font-size:12px;text-align:center}
/* Sheets / dialogs */
dialog{border:1px solid var(--line);border-radius:20px;background:rgba(16,20,23,.92);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  color:var(--ink);padding:0;width:min(440px,calc(100vw - 32px));box-shadow:var(--shadow-pop)}
dialog::backdrop{background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@media (prefers-reduced-motion:no-preference){
  dialog[open]{animation:sheetIn .18s ease}
  @keyframes sheetIn{from{opacity:0;transform:translateY(8px)}}
}
.sheet{padding:24px}
.sheet h3{margin:0 0 6px;font-size:18px;font-weight:650;letter-spacing:-.01em}
.sheet h4{margin:18px 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.fld{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 6px}
.sheet input[type=text],.sheet input[type=number],.sheet input[type=password],.log-row input,
.page input[type=text],.page input[type=number],.page input[type=password]{
  width:100%;background:rgba(0,0,0,.38);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:12px 14px;font-size:15px;outline:none}
.sheet input:focus-visible,.page input:focus-visible{border-color:var(--accent);box-shadow:var(--focus)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row.end{justify-content:flex-end}
.fld-wrap{flex:1;min-width:130px}
.divider{border:0;border-top:1px solid var(--line-soft);margin:18px 0 0}
.seg{display:flex;background:rgba(0,0,0,.35);border:1px solid var(--line-soft);border-radius:999px;padding:4px;gap:4px;margin-top:8px}
.seg label{flex:1;display:block;cursor:pointer;margin:0}
.seg-opt{display:flex;justify-content:center;padding:10px 12px;border-radius:999px;font-size:13.5px;
  font-weight:500;color:var(--muted);transition:background .15s ease,color .15s ease}
.seg label:has(input:checked) .seg-opt{background:var(--accent);color:var(--accent-ink);font-weight:650}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--accent)}
::selection{background:rgba(77,182,172,.3)}
@media(max-width:520px){
  .page{padding:16px 14px 72px}
  .hero{padding:32px 4px 24px}
  .log-row{flex-direction:column}
  .log-row .primary-btn{width:100%}
  .sheet{padding:20px}
}
</style>
