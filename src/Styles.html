<style>
:root{
  --bg:#f7f7f5; --surface:#ffffff;
  --border:#e6e7ea; --border-strong:#d9dbe0;
  --text:#1a1c1e; --muted:#5f6368; --faint:#8a919b;
  --accent:#00796b; --accent-ink:#ffffff;
  --accent-soft:rgba(0,121,107,.08); --accent-border:rgba(0,121,107,.32);
  --radius:16px; --radius-sm:12px;
  --shadow-1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.07);
  --shadow-2:0 2px 4px rgba(16,24,40,.06),0 8px 20px rgba(16,24,40,.08);
  --shadow-3:0 12px 32px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.08);
  --focus:0 0 0 3px rgba(0,121,107,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Roboto,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  line-height:1.55; -webkit-font-smoothing:antialiased;
}
/* Minimal theme: ambient aurora disabled, kept hidden for compatibility */
.aurora{display:none!important}
.scrim{display:none!important}
.wrap{max-width:1024px;margin:0 auto;padding:28px 20px 72px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 20px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);box-shadow:var(--shadow-1);flex:none}
.brand h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;cursor:pointer;box-shadow:var(--shadow-1);transition:box-shadow .15s ease,background .15s ease,border-color .15s ease}
.btn:hover{background:#f1f3f4;border-color:#cfd3d8;box-shadow:var(--shadow-2)}
.btn:active{box-shadow:var(--shadow-1)}
.btn:focus-visible{outline:none;box-shadow:var(--focus)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{background:#00685d}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{padding:7px 14px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.grid{display:grid;gap:16px}
@media(min-width:860px){.grid.cols4{grid-template-columns:repeat(4,1fr)}.grid.cols2{grid-template-columns:1.2fr .8fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-1);position:relative}
.card h2{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin:0 0 10px}
.metric{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.hero{display:grid;gap:16px;margin-bottom:16px}
@media(min-width:860px){.hero{grid-template-columns:1.35fr .65fr}}
.logbox{display:flex;flex-direction:column;gap:10px}
label.lbl{font-size:13px;font-weight:500;color:var(--text)}
input[type=text],input[type=number],input[type=date],input[type=password],select{
  width:100%;background:var(--surface);border:1px solid var(--border-strong);color:var(--text);
  border-radius:var(--radius-sm);padding:12px 14px;font-size:15px;outline:none;box-shadow:none}
input:hover,select:hover{border-color:#bdc2c9}
input:focus-visible,select:focus-visible{box-shadow:var(--focus);border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--faint)}
.timeline{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.timeline li{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fafbfc;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px;box-shadow:var(--shadow-1)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 10px;background:#f1f3f4}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px;margin:8px 0 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:500}
.notice{border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px;border:1px solid var(--border-strong);background:#f1f3f4;color:var(--text);box-shadow:var(--shadow-1)}
.notice.warn{border-left:4px solid var(--accent);background:var(--accent-soft)}
.notice.err{border-left:4px solid var(--accent);background:var(--accent-soft);font-weight:500}
dialog{border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--text);padding:0;max-width:520px;width:calc(100vw - 32px);box-shadow:var(--shadow-3)}
dialog::backdrop{background:rgba(16,24,40,.45)}
.modal-body{padding:24px}
.modal-body h3{margin:0 0 6px;font-size:18px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row.end{justify-content:flex-end}
.seg{display:flex;background:#f1f3f4;border:1px solid var(--border);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg label:has(input:checked) .pill{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{margin-top:24px;color:var(--faint);font-size:12px;text-align:center}
a{color:var(--accent)}
@media(max-width:560px){.metric{font-size:28px}.wrap{padding:18px 14px 64px}header.top{flex-direction:column;align-items:flex-start}}
</style>
